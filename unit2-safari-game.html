<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 2 Safari: Grammar Practice</title>
<style>
:root{--ink:#3a2410;--leaf:#2f6b3c;--sand:#f6e7bd;--sun:#e8962c;--ok:#1fa85a;--bad:#d8402f}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#bfe5f2 0%,#fdf0c8 55%,#e9c985 100%);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:1.4rem;font-weight:900;background:#fff;border-radius:40px;padding:6px 20px;border:4px solid var(--leaf)}
.stats{display:flex;gap:8px;align-items:center}
.pill{background:#fff;border:3px solid #e2cd93;border-radius:30px;padding:6px 14px;font-weight:800}
button{font-family:inherit;cursor:pointer}
.mute{border:3px solid #e2cd93;background:#fff;border-radius:50%;width:44px;height:44px;font-size:1.3rem}
.trail{display:flex;gap:6px;margin:14px 0;align-items:center}
.trail i{flex:1;height:14px;border-radius:8px;background:#fff;border:2px solid #e2cd93}
.trail i.on{background:var(--ok);border-color:var(--ok)}
.trail i.off{background:var(--bad);border-color:var(--bad)}
.trail i.now{background:var(--sun);border-color:var(--sun)}
.card{background:#fffaf0;border:4px solid var(--leaf);border-radius:26px;padding:20px;margin:12px 0;box-shadow:0 6px 0 rgba(58,36,16,.14)}
h1,h2{margin:.2em 0}
.tag{display:inline-block;background:#d9efd9;border-radius:12px;padding:4px 12px;font-weight:800}
.big{font-size:3.6rem;text-align:center;margin:6px 0}
.sent{font-size:1.6rem;font-weight:900;text-align:center;line-height:1.4;margin:6px 0}
.sent .gap{display:inline-block;min-width:80px;border-bottom:4px solid var(--sun);color:var(--leaf)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.opt{background:#fff;border:4px solid #e2cd93;border-radius:18px;padding:14px;font-size:1.3rem;font-weight:800;color:var(--ink)}
.opt:hover{transform:translateY(-2px);border-color:var(--sun)}
.opt.right{background:#c9f3d8;border-color:var(--ok)}
.opt.wrong{background:#ffd5d0;border-color:var(--bad)}
.btn{background:var(--sun);color:#fff;border:0;border-bottom:5px solid #a9660f;border-radius:16px;padding:12px 26px;font-size:1.15rem;font-weight:900;margin:10px 6px 0 0}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.g{background:var(--leaf);border-bottom-color:#1a4125}
input[type=text]{width:100%;font:inherit;font-size:1.3rem;text-align:center;padding:10px;border:4px solid #e2cd93;border-radius:16px;color:var(--ink)}
input:focus,button:focus-visible{outline:4px solid var(--sun)}
.fb{min-height:32px;text-align:center;font-weight:900;font-size:1.15rem;margin-top:12px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .5s}
@keyframes pp{50%{transform:scale(1.05)}}
.stars{font-size:3rem;text-align:center}
.center{text-align:center}
.rule{font-size:1.05rem;line-height:1.7}
.meter{display:flex;gap:6px;margin:8px 0}
.meter span{flex:1;text-align:center;border-radius:12px;padding:8px 4px;font-weight:900;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#fff;border:3px solid #e2cd93;border-radius:16px;padding:8px 12px;font-weight:700;font-size:1.05rem;color:var(--ink)}
.rev{text-align:left;margin:8px 0;padding:8px 12px;border-radius:12px;background:#fff0ec;border-left:6px solid var(--bad)}
.fall{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fl 2.8s linear forwards;z-index:9}
@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}
footer{text-align:center;font-weight:800;margin:18px 0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="logo">🦁 Unit 2 Safari</div>
 <div class="stats"><span class="pill">⭐ <span id="sc">0</span></span><span class="pill">🔥 <span id="st">0</span></span><button class="mute" id="mu" aria-label="Sound on or off">🔊</button></div>
</header>
<div class="trail" id="tr"></div>
<main id="app"></main>
<footer>Created by T.Badria Alfalahi ✨</footer>
</div>
<script>
let ctx,muted=false,score=0,streak=0,best=0,idx=-1,name="",tries=0,locked=false,res=[];
const $=id=>document.getElementById(id);
function ac(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d,type="sine",delay=0,vol=.2){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}
const sfx={
 click:()=>tone(660,.08,"square",0,.08),
 ok:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.18,"triangle",i*.09,.22)),
 no:()=>{tone(200,.25,"sawtooth",0,.15);tone(150,.3,"sawtooth",.15,.15)},
 win:()=>[523,659,784,659,784,1046,1318].forEach((f,i)=>tone(f,.25,"triangle",i*.13,.25)),
 star:()=>tone(1200,.15,"sine",0,.15)
};
function speak(t){if(muted||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/_+/g,"blank"));u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}
function confetti(n=24){const e=["🎉","⭐","🌟","✨","🦁"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="fall";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3800)}}
$("mu").onclick=()=>{muted=!muted;$("mu").textContent=muted?"🔇":"🔊";if(muted&&window.speechSynthesis)speechSynthesis.cancel();else sfx.click()};

// s: sentence with ___ ; o: options in worksheet order (a, b, c); a: index of correct option
const Q=[
 {e:"🦁",pre:"It might",post:"a lion. I can’t see it clearly.",o:["was","be","been"],a:1,h:"After might we use the base verb: be."},
 {e:"🌳",pre:"The animal could",post:"behind that tree.",o:["hide","hid","hidden"],a:0,h:"After could we use the base verb."},
 {e:"🐦",pre:"This bird can’t",post:"with an injured wing.",o:["flew","flown","fly"],a:2,h:"After can’t we use the base verb."},
 {e:"🐱",pre:"The cat may",post:"the fish.",o:["eat","ate","eaten"],a:0,h:"After may we use the base verb."},
 {e:"🐾",pre:"It must",post:"sharp claws. Look at those marks!",o:["had","having","have"],a:2,h:"After must we use the base verb."},
 {e:"🦅",pre:"It",post:"be an eagle. It has fur and paws.",o:["must","can’t","may"],a:1,h:"An eagle has no fur. You are sure it is NOT an eagle."},
 {e:"😺",pre:"It",post:"be a cat. It has whiskers and says “meow”.",o:["could","can’t","must"],a:2,h:"You have strong clues. You are sure it IS a cat."},
 {e:"🐇",pre:"It",post:"be a rabbit, but I’m not sure. It’s too far away.",o:["may","must","can’t"],a:0,h:"“I’m not sure” means maybe."},
 {e:"🐍",pre:"It",post:"be a snake. I can clearly see four legs.",o:["might","must","can’t"],a:2,h:"A snake has no legs. You are sure it is NOT a snake."},
 {e:"🔊",pre:"I can hear an animal outside. It",post:"be a cat, but it could be something else.",o:["can’t","might","must"],a:1,h:"“It could be something else” means you are not sure."}
];
const L=["a","b","c"],MAXPTS=Q.length*10;
function trail(){$("tr").innerHTML=Q.map((_,i)=>`<i class="${res[i]===1?"on":res[i]===0?"off":i===idx?"now":""}"></i>`).join("")}
function hud(){$("sc").textContent=score;$("st").textContent=streak;trail()}
function full(q,w){return q.pre+" "+(w||q.o[q.a])+" "+q.post}
function start(){
 $("app").innerHTML=`<div class="card center pop"><div class="big">🦁🐍🦅🐇</div>
 <h1>Grammar Safari</h1><p>Spot the animal! Choose the correct answer to complete each sentence with <b>might, may, could, must</b> and <b>can’t</b>.</p>
 <p><input type="text" id="nm" maxlength="20" placeholder="Type your name" aria-label="Your name" autocomplete="off"></p>
 <button class="btn" onclick="go()">Start the safari</button></div>`;hud()
}
function go(){ac();name=($("nm").value||"Explorer").trim();sfx.click();speak("Hello "+name+"! Let's go on a safari.");learn()}
function say(t){sfx.click();speak(t)}
function learn(){
 idx=-1;hud();
 $("app").innerHTML=`<div class="card pop"><h2>Hello, ${name}! 👋</h2><p>Tap a sentence to hear it. Remember the rules, then start!</p></div>
 <div class="card"><div class="meter"><span style="background:#d8402f">can’t = sure no</span><span style="background:#e8962c">might / may / could = maybe</span><span style="background:#2f6b3c">must = sure yes</span></div>
 <div class="chips"><button class="chip" onclick="say('It might be a lion.')">🦁 It might be a lion.</button><button class="chip" onclick="say('It must be a cat.')">😺 It must be a cat.</button><button class="chip" onclick="say('It can not be a snake.')">🐍 It can’t be a snake.</button></div></div>
 <p class="center rule">✨ After a modal verb (might, may, could, must, can’t) always use the <b>base verb</b>: be, hide, fly, eat, have.</p>
 <div class="center"><button class="btn g" onclick="next()">Let’s go! 🚙</button></div>`
}
function next(){idx++;tries=0;locked=false;sfx.click();if(idx>=Q.length){hud();return end()}hud();render()}
function render(){
 const q=Q[idx];
 $("app").innerHTML=`<div class="card pop"><span class="tag">Choose the correct answer</span> <span style="float:right;font-weight:800">${idx+1} / ${Q.length}</span>
 <div class="big">${q.e}</div><div class="sent">${q.pre} <span class="gap" id="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> ${q.post}</div>
 <div class="opts">${q.o.map((x,i)=>`<button class="opt" onclick="pick(this,${i})">${L[i]}) ${x}</button>`).join("")}</div>
 <div class="fb" id="fb" aria-live="polite"></div><div class="center" id="nx"></div></div>`;
 speak(q.pre+" blank "+q.post)
}
function nextBtn(){$("nx").innerHTML=`<button class="btn g" onclick="next()">${idx===Q.length-1?"See my result 🏆":"Next ➜"}</button>`}
function pick(b,i){
 if(locked)return;const q=Q[idx];
 if(i===q.a){
  locked=true;b.classList.add("right");const pts=tries===0?10:5;score+=pts;streak++;best=Math.max(best,streak);res[idx]=1;
  $("gap").textContent=q.o[i];sfx.ok();hud();
  const f=$("fb");f.className="fb ok";f.textContent=(tries===0?"Perfect! 🎉":"Good job! 👍")+" +"+pts;
  if(streak%3===0){setTimeout(()=>{sfx.star();confetti(14)},350);f.textContent+="  🔥 "+streak+" in a row!"}
  speak(full(q));nextBtn();return
 }
 b.classList.add("wrong");b.disabled=true;tries++;streak=0;sfx.no();
 const c=$("app").firstElementChild;c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
 const f=$("fb");
 if(tries>=2){locked=true;res[idx]=0;hud();document.querySelectorAll(".opt")[q.a].classList.add("right");$("gap").textContent=q.o[q.a];f.className="fb no";f.innerHTML=`The answer is: <b>${full(q)}</b>`;speak(full(q));nextBtn();return}
 hud();f.className="fb no";f.textContent="Not yet. Hint: "+q.h
}
function end(){
 const pc=Math.round(score/MAXPTS*100),st=pc>=85?3:pc>=60?2:pc>=30?1:0,right=res.filter(x=>x===1).length;
 const msg=["Keep practising. You can do it! 💪","Good start! Try again for more stars.","Great work! Almost perfect!","Amazing! You are a safari grammar expert!"][st];
 const miss=Q.map((q,i)=>res[i]===0?`<div class="rev">${i+1}. <b>${full(q)}</b></div>`:"").join("");
 sfx.win();confetti(40);speak("Well done "+name+"! Your score is "+score+" out of "+MAXPTS);
 $("app").innerHTML=`<div class="card center pop"><h1>Safari complete, ${name}! 🏆</h1>
 <div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
 <h2>${score} / ${MAXPTS} points (${pc}%)</h2>
 <p>Correct answers: <b>${right}</b> / ${Q.length} &nbsp;·&nbsp; Best streak: <b>🔥 ${best}</b></p>
 <p class="rule">${msg}</p>
 ${miss?`<p><b>Review these sentences:</b></p>${miss}`:""}
 <button class="btn" onclick="again()">Play again 🔄</button><button class="btn g" onclick="learn()">Review rules 📘</button></div>`
}
function again(){score=0;streak=0;best=0;idx=-1;res=[];sfx.click();learn()}
start();
</script>
</body>
</html>
